<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="2001" viewBox="0 0 1125 2001"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#164b50"/><stop offset="1" stop-color="#0b252a"/></linearGradient><linearGradient id="card" x2=".8" y2="1"><stop stop-color="#1b5960"/><stop offset="1" stop-color="#103c43"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f8cb70"/><stop offset="1" stop-color="#e8953e"/></linearGradient></defs><rect width="1125" height="2001" fill="url(#bg)"/><rect width="1125" height="2001" fill="#081f23" opacity=".82"/><rect x="78" y="528" width="969" height="946" rx="54" fill="#071e22" opacity=".45"/><rect x="78" y="528" width="969" height="946" rx="54" fill="url(#card)" stroke="#f4e8cf" stroke-opacity=".2" stroke-width="3"/><rect x="484.5" y="600" width="156" height="156" rx="42" fill="url(#gold)" stroke="#fff4d6" stroke-width="9"/><image href="../Boosters/Exports/scissors.png" x="507" y="622.5" width="111" height="111" preserveAspectRatio="xMidYMid meet"/><text x="562.5" y="835" text-anchor="middle" fill="#eaf3f2" font-size="60" font-weight="700">Yeni booster: Makas</text><text x="144" y="900" fill="#b3cbca" font-size="39"><tspan x="144">Makas iki parça arasındaki birleşimi</tspan><tspan x="144" dy="58">keser ve o kenar dümdüz olur. Kesilen</tspan><tspan x="144" dy="58">yerde artık hiçbir şey takılmaz, sıkışmış</tspan><tspan x="144" dy="58">parça serbest kalır.</tspan></text><text x="144" y="1150" fill="#f0a742" font-size="39"><tspan x="144">Makasa bas, sonra kesmek istediğin</tspan><tspan x="144" dy="58">turuncu noktaya dokun.</tspan></text><rect x="144" y="1282" width="837" height="138" rx="33" fill="url(#gold)"/><text x="562.5" y="1370" text-anchor="middle" fill="#33220a" font-size="45" font-weight="700">Anladım</text></svg>

